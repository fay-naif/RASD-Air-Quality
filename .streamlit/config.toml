[theme]
base="light"
font="Tajawal:https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap"
headingFont="Tajawal:https://fonts.googleapis.com/css2?family=Tajawal:wght@500;600;700&display=swap"
primaryColor="#087F72"
backgroundColor="#F3F7F5"
secondaryBackgroundColor="#FFFFFF"
textColor="#17312D"
borderColor="#D7E4DF"
baseRadius="large"
buttonRadius="medium"
showWidgetBorder=true
showSidebarBorder=true
paddingTop="1.5rem"
paddingBottom="2.5rem"
chartCategoricalColors=["#087F72","#D69A46","#5E7C97","#9A6FA4"]

[theme.light]
primaryColor="#087F72"
backgroundColor="#F3F7F5"
secondaryBackgroundColor="#FFFFFF"
textColor="#17312D"
borderColor="#D7E4DF"
linkColor="#087F72"

[theme.dark]
primaryColor="#64D8C4"
backgroundColor="#091411"
secondaryBackgroundColor="#12231F"
textColor="#EAF4F1"
borderColor="#29423B"
linkColor="#64D8C4"
chartCategoricalColors=["#64D8C4","#E7B86D","#91AFC3","#C69AC9"]

[theme.light.sidebar]
backgroundColor="#EAF2EE"
secondaryBackgroundColor="#DFECE7"
textColor="#17312D"
borderColor="#CBDDD6"

[theme.dark.sidebar]
backgroundColor="#0D1C18"
secondaryBackgroundColor="#183029"
textColor="#EAF4F1"
borderColor="#29423B"
